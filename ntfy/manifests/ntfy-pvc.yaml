apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache
  namespace: ntfy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: kube-nfs
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: users
  namespace: ntfy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: kube-nfs
  resources:
    requests:
      storage: 10Mi
