apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: box-mcp-server
  name: box-mcp-server
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      service: box-mcp-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: box-mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - envFrom:
          - secretRef:
              name: box-mcp-server
          image: 996472359368.dkr.ecr.us-east-1.amazonaws.com/mcp-server-box@sha256:53ca80058fe7a255753a31e8dd754115c6c5d9465f1f24bdab386ed0a0eba6d1
          imagePullPolicy: IfNotPresent
          name: box-mcp-server
          command:
            - /usr/local/bin/python
            - /app/mcp_server_box.py
          args:
            - --transport
            - http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --mcp-auth-type
            - none
            - --box-auth-type
            - ccg
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              memory: "250Mi"
            limits:
              memory: "500Mi"
