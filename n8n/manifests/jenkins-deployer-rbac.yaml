apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-jenkins-deployer
  namespace: n8n
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["n8n"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-jenkins-deployer
  namespace: n8n
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: n8n-jenkins-deployer
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: jenkins
