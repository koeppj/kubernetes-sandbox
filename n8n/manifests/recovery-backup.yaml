apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-recovery-backup
  namespace: n8n
spec:
  storageClassName: kube-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 40Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-postgres-pre-pg17-backup
  namespace: n8n
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        job: n8n-postgres-pre-pg17-backup
    spec:
      restartPolicy: Never
      containers:
        - name: backup
          image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              pg_dump \
                --host=postgres-n8n \
                --username="$POSTGRES_USER" \
                --dbname="$POSTGRES_DB" \
                --format=custom \
                --no-owner \
                --file=/backup/n8n-postgres-pre-pg17.dump
              pg_restore --list /backup/n8n-postgres-pre-pg17.dump \
                > /backup/n8n-postgres-pre-pg17.list
              psql \
                --host=postgres-n8n \
                --username="$POSTGRES_USER" \
                --dbname="$POSTGRES_DB" \
                --no-align \
                --tuples-only \
                --command="select 'server_version|' || current_setting('server_version');" \
                --command="select 'database_bytes|' || pg_database_size(current_database());" \
                --command="select 'workflows|' || count(*) from workflow_entity;" \
                --command="select 'credentials|' || count(*) from credentials_entity;" \
                --command="select 'executions|' || count(*) from execution_entity;" \
                --command="select 'migrations|' || count(*) from migrations;" \
                --command="select 'latest_migration|' || id || '|' || name from migrations order by id desc limit 1;" \
                > /backup/n8n-postgres-pre-pg17.inventory
              cd /backup
              sha256sum \
                n8n-postgres-pre-pg17.dump \
                n8n-postgres-pre-pg17.list \
                n8n-postgres-pre-pg17.inventory \
                > n8n-postgres-pre-pg17.sha256
              sha256sum -c n8n-postgres-pre-pg17.sha256
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: backup
              mountPath: /backup
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: n8n-recovery-backup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: n8n-files-pre-pg17-backup
  namespace: n8n
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        job: n8n-files-pre-pg17-backup
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backup
          image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              test -s /source/config
              tar -C /source -czf /backup/n8n-files-pre-pg17-retry.tar.gz .
              tar -tzf /backup/n8n-files-pre-pg17-retry.tar.gz \
                > /backup/n8n-files-pre-pg17-retry.list
              cd /backup
              sha256sum \
                n8n-files-pre-pg17-retry.tar.gz \
                n8n-files-pre-pg17-retry.list \
                > n8n-files-pre-pg17-retry.sha256
              sha256sum -c n8n-files-pre-pg17-retry.sha256
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: backup
              mountPath: /backup
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: n8n-pv-claim
        - name: backup
          persistentVolumeClaim:
            claimName: n8n-recovery-backup
